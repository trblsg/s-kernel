# iOS 26 on Apple's xnu-12377.121.6, the base the Pixel 10 Pro port (ios-on-pixel-10, NOTICE) boots on. Only the pristine base and
# Scion's own changes (the fork's branch) are here: that port's kernel changes are not, because its tree carries ios-tegu's changes, which have no licence
# (docs/two-bases.md). Nothing built from this profile has booted.
profile ios-26
	status      experimental
	arch        arm64e
	darwin      25.5.0
	xnu_tag     xnu-12377.121.6
	xnu_commit  ac9718fb1af618d5ce8678d0dc6e8a58f252216f
	xnu_fork    https://github.com/Scion-Project/xnu.git
	fork_branch scion/xnu-12377
	fork_commit 296d251e68eacb602e33b854d8517961cb79bfd5
	base        xnu-12377
	machine     VMAPPLE
	sdk         26
	hfs         no
	adt         none in git: the builder's own device tree (devices/blazer/README.md)
	userland    arm64e iOS 26, from the builder's own IPSW: needs CPUs with FEAT_PAuth (Tensor G5 has it; the Exynos 9810 does not)
