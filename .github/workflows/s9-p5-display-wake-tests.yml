name: S9 P5 Display Wake and GPU Attribution Lab

on:
  push:
    branches: [s9/p5-display-wake-gpu-lab]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: P5 10fps idle, 60fps wake and gap accounting in strict C11/C++17 UBSan
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=undefined \
            tools/tests/test_s9_p5_frame_lab.c -o /tmp/p5_c
          /tmp/p5_c
          c++ -x c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=undefined \
            tools/tests/test_s9_p5_frame_lab.c -o /tmp/p5_cpp
          /tmp/p5_cpp
      - name: Regressions P4 per-core and P0/G3D paths
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=undefined \
            tools/tests/test_s9_p4_idle_lab.c -o /tmp/p4_c
          /tmp/p4_c
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            tools/tests/test_s9_g3d_lab_policy.c -o /tmp/g3d
          /tmp/g3d
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            userland/tests/test_s9_ioshash4.c -o /tmp/p0
          /tmp/p0
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            userland/tests/test_gl_stage_stats.c -o /tmp/gl
          /tmp/gl
          bash -n userland/build.sh
      - name: P5 source integration and non-invasive guardrails
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path('drivers/gpu/mali/hakios.mali.c').read_text()
          m=Path('drivers/gpu/mali/hakios.mali_lab.h').read_text()
          h=Path('drivers/gpu/mali/hakios.p5_lab.h').read_text()
          e=Path('userland/src/eagl.c').read_text()
          p=Path('userland/src/poster_cost.c').read_text()
          mapping=Path('drivers/map').read_text()
          assert 'gpu/mali bsd/dev/hakios.p5_lab.h' in mapping
          assert '#include "hakios.p5_lab.h"' in g
          assert 'p5_queue_added_locked(owner,mali_queue_count)' in g
          assert 'p5_queue_completed_locked(owner,fragment,dropped,p5_job_status,' in g
          assert 'p5_monitor_snapshot(now,up_ns,status,pll,mux,awake_state != 0)' in m
          assert '!__atomic_load_n(&p5_mode,__ATOMIC_RELAXED)' in m
          assert 'if (g3d_lab_gate || g3d_lab_mv != 950 || g3d_lab_rail_probe ||' in m
          assert 'no_gpu' not in h or 'No GPU-domain MMIO' in h
          assert 'PMU_G3D_STATUS' in m and 'PLL_CON0' in m
          assert 'deep=unmeasured voltage=unmeasured' in h
          assert 'SYSCTL_PROC(_kern_hakios,OID_AUTO,p5_mode,' in h
          assert 'SYSCTL_PROC(_kern_hakios,OID_AUTO,p5_phase,' in h
          assert 'SYSCTL_PROC(_kern_hakios,OID_AUTO,p5_threads,' in h
          assert 'SYSCTL_PROC(_kern_hakios,OID_AUTO,p5_stats,' in h
          assert 'p5_frame_observe(e,after,end_reason)' in e
          assert 'p4_frame_observe(e, after, presented, in_place, copied, end_reason)' in e
          assert 'surface_changed(' in e
          assert 'p5-gl-resume:' in e
          assert 'p5-gl-burst:' in e
          assert 's9_ioshash4_fast(base,size)' in e
          assert 'glDrawElements(mode, count, type, indices);' in e
          assert 'glFlush();' in e and 'glFinish();' in e
          assert 'PROC_PIDTHREADINFO' in p
          assert 'p5-display-thread:' in p
          assert 'p5-thread-state:' in p
          assert 'p5_mode>=2 && p5_threads>0?1:interval' in p
          assert 'GOV_CAP1_MC     85000' in g and 'GOV_CAP2_MC     95000' in g
          print('P5 guards: no frame drop, no new GPU-domain MMIO while OFF, no power/thermal mutation: PASS')
          PY

  putty-preview:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell 5.1 PuTTY automation without sending serial commands
        shell: pwsh
        run: |
          $file = (Resolve-Path 'tools/s9-p5-putty-auto.ps1').Path
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw ('PowerShell parse errors: ' + ($errors -join '; ')) }
          $source = Get-Content -LiteralPath $file -Raw
          foreach ($guard in @('ToCharArray()', 'Start-Sleep -Milliseconds $KeyDelayMs', 'sysctl kern.hakios.p5_phase=0', 'PHASE=0', '[ValidateRange(1,2)][int]$EnterCount = 2', 'Start-Sleep -Milliseconds $EnterDelayMs', 'SendWait(''{ENTER}'')')) {
            if (-not $source.Contains($guard)) { throw ('Missing slow-serial/ack guard: ' + $guard) }
          }
          if ($source.Contains('SendWait($Command +')) { throw 'Unsafe full-string serial key injection reintroduced' }
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $file -Port COM125
          if ($LASTEXITCODE -ne 0) { throw ('PuTTY dry run failed: ' + $LASTEXITCODE) }
          $preview = $output -join "`n"
          foreach ($required in @(
            'mode=PREVIEW ONLY',
            'PREVIEW SEND: sysctl kern.hakios.p5_phase=1',
            'PREVIEW WAIT 120s: A1',
            'PREVIEW SEND: sysctl kern.hakios.p5_phase=2',
            'PREVIEW WAIT 180s: B1',
            'PREVIEW SEND: sysctl kern.hakios.p5_phase=3',
            'PREVIEW SEND: sysctl kern.hakios.p5_mode=2',
            'PREVIEW SEND: sysctl kern.hakios.p5_phase=4',
            'PREVIEW OPERATOR ACTION: Physically turn S9 display OFF',
            'PREVIEW SEND: sysctl kern.hakios.p5_phase=6',
            'PREVIEW SEND: sysctl kern.hakios.p5_mode=0',
            'PREVIEW SEND: sysctl kern.hakios.p5_phase=7')) {
            if (-not $preview.Contains($required)) { throw ('Missing preview stage: ' + $required) }
          }
          if (-not $preview.Contains('Enter x2, 450ms between Enters')) { throw 'Default double-Enter preview missing' }
          if ($preview.Contains('Sent to PuTTY PID')) { throw 'Unexpected input sent in preview mode' }
          Write-Output 'P5 PuTTY COM125 dry-run stage and syntax checks PASS (no device attached)'
      - name: Validate direct USB CDC-ACM COM125 capture and ACK-gated P5 automation
        shell: pwsh
        run: |
          $file = (Resolve-Path 'tools/s9-p5-serial-auto.ps1').Path
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw ('P5 direct serial PowerShell syntax: ' + ($errors -join '; ')) }
          $source = Get-Content -LiteralPath $file -Raw
          foreach ($required in @(
            '[IO.Ports.SerialPort]::new(',
            'Send-Checked',
            '$script:Serial.Write($bytes,0,$bytes.Length)',
            '$script:Serial.Read($script:Buf,0,$script:Buf.Length)',
            'usb> ',
            ': set (0)',
            'GenericARMPE: the display ',
            '[IO.FileMode]::CreateNew',
            'Do-SafeExit')) {
            if (-not $source.Contains($required)) { throw ('Missing serial safety feature: ' + $required) }
          }
          if ($source.Contains('[System.Windows.Forms.SendKeys]')) { throw 'GUI SendKeys accidentally introduced into direct serial client' }
          $preview = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $file -Port COM125
          if ($LASTEXITCODE -ne 0) { throw ('Direct serial dry-run failed: ' + $LASTEXITCODE) }
          $all = $preview -join "`n"
          foreach ($required in @(
            'mode=PREVIEW ONLY',
            'PREVIEW SEND/VERIFY: sysctl kern.hakios.p5_stats',
            'PREVIEW SEND/VERIFY: sysctl kern.hakios.p5_phase=0',
            'PREVIEW SEND/VERIFY: sysctl kern.hakios.p5_phase=1',
            'PREVIEW SEND/VERIFY: sysctl kern.hakios.p5_mode=2',
            'PLEASE physically turn the S9 screen off',
            'PLEASE physically turn the S9 screen on',
            'PREVIEW SAFE EXIT',
            'No COM port opened; no data sent')) {
            if (-not $all.Contains($required)) { throw ('Missing P5 direct serial preview: ' + $required) }
          }
          $minimal = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $file -Port COM125 -PreflightOnly
          if ($LASTEXITCODE -ne 0) { throw 'Preflight-only dry-run failed' }
          if (($minimal -join "`n").Contains('A1 screen ON baseline')) { throw 'Preflight-only mode attempted A1 phase' }
          Write-Output 'P5 direct USB CDC-ACM COM125 preview, ACK gate, log and preflight-only checks PASS (no device attached)'

  ios-syntax:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile poster_cost per-thread observer as iOS ARM64 syntax
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -std=gnu11 -Wall -Wextra -Wno-deprecated-declarations \
            -fsyntax-only userland/src/poster_cost.c
      - name: Compile P5 GLES summary implementation as iOS ARM64 syntax
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          # The normal SIOS GL build generates eagl_gen.h from Mesa's
          # gl.xml/exported-gl.txt (userland/build.sh). A bare checkout
          # does not contain this file, so generate a syntax-only table
          # from the Khronos XML and the gl* calls already present in
          # eagl.c. This is NOT a linked or exact-Mesa userland build.
          curl --fail --location --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/KhronosGroup/OpenGL-Registry/main/xml/gl.xml \
            --output "$RUNNER_TEMP/p5-gl.xml"
          python3 - <<'PY'
          import re
          from pathlib import Path
          source=Path('userland/src/eagl.c').read_text()
          names=sorted(set(re.findall(r'(?<![A-Za-z0-9_])(gl[A-Z][A-Za-z0-9_]*)\s*\(',source)))
          Path('p5-exported-gl.txt').write_text('\n'.join(names)+'\n')
          print('P5 CI syntax-table exported symbols:',len(names))
          PY
          python3 userland/mkeagl.py \
            userland/src/eagl_slots.txt "$RUNNER_TEMP/p5-gl.xml" \
            p5-exported-gl.txt userland/src/eagl.c \
            > "$RUNNER_TEMP/eagl_gen.h"
          set +e
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -std=gnu11 -Wall -Wextra -Wno-deprecated-declarations \
            -Iuserland/src -I"$RUNNER_TEMP" -fsyntax-only \
            userland/src/eagl.c >p5-eagl-compiler.txt 2>&1
          status=$?
          cat p5-eagl-compiler.txt
          python3 - <<'PY'
          import re
          for line in open('p5-eagl-compiler.txt',errors='replace'):
              m=re.match(r'([^:]+):(\d+):(\d+): (fatal error|error): (.*)',line)
              if m:
                  path,num,col,severity,msg=m.groups()
                  msg=msg.strip().replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print(f'::error file={path},line={num},col={col}::{severity}: {msg}')
          PY
          exit "$status"
