name: S9 P6 Unified Wake / Thermal / G3D / CA Lab
on:
  push:
    branches: [s9/p6-unified-wake-thermal-display-lab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: P6 shadow thermal and CPU parking classifiers C11/C++17 UBSan
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=undefined tools/tests/test_s9_p6_policy.c -o /tmp/p6_c
          /tmp/p6_c
          c++ -x c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=undefined tools/tests/test_s9_p6_policy.c -o /tmp/p6_cpp
          /tmp/p6_cpp
      - name: P6.6 candidate classification regressions C11 and C++17 UBSan
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=undefined tools/tests/test_s9_p66_frame_bucket.c -o /tmp/p66_c
          /tmp/p66_c
          c++ -x c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=undefined tools/tests/test_s9_p66_frame_bucket.c -o /tmp/p66_cpp
          /tmp/p66_cpp
      - name: P6.10--P6.12 governor/hash/output classifiers C11/C++17 UBSan
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=undefined tools/tests/test_s9_p610_612_diag.c -o /tmp/p610_c
          /tmp/p610_c
          c++ -x c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=undefined tools/tests/test_s9_p610_612_diag.c -o /tmp/p610_cpp
          /tmp/p610_cpp
      - name: Retain P5, P4 and G3D regressions
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=undefined tools/tests/test_s9_p5_frame_lab.c -o /tmp/p5
          /tmp/p5
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=undefined tools/tests/test_s9_p4_idle_lab.c -o /tmp/p4
          /tmp/p4
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic tools/tests/test_s9_g3d_lab_policy.c -o /tmp/g3d
          /tmp/g3d
          bash -n userland/build.sh
      - name: P6 source integration and no-write / safe-exit guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cpu=Path('drivers/power/exynos/hakios.exynos_cpufreq.c').read_text()
          k=Path('drivers/power/exynos/hakios.p6_lab.h').read_text()
          e=Path('userland/src/eagl.c').read_text()
          p=Path('userland/src/poster_cost.c').read_text()
          usb=Path('drivers/usb/hakios.dwc3.c').read_text()
          touch=Path('drivers/input/touch/hakios.s6sy761.c').read_text()
          wifi=Path('drivers/wifi/lx/hakios.lx.c').read_text()
          report=Path('tools/s9-p6-report.ps1').read_text()
          gpu=Path('drivers/gpu/mali/hakios.mali.c').read_text()
          g=Path('drivers/gpu/mali/hakios.mali_lab.h').read_text()
          m=Path('drivers/map').read_text()
          serial=Path('tools/s9-p6-serial-auto.ps1').read_text()
          for f in ('hakios.p6_lab.h','hakios.p6_policy.h'):
              assert f in m
          for s in ('#include "hakios.p6_lab.h"','p6_probe(now)','p6_frame_events','p6_touch_events'):
              assert s in cpu
          for s in ('SYSCTL_PROC(_kern_hakios,OID_AUTO,p6_mode','SYSCTL_PROC(_kern_hakios,OID_AUTO,p6_phase','SYSCTL_PROC(_kern_hakios,OID_AUTO,p6_flags','SYSCTL_PROC(_kern_hakios,OID_AUTO,p6_stats','source=governor_and_scheduler_proxy_not_IRQ','writes=0'):
              assert s in k
          assert 'g3d_lab_gate = (uint32_t)value;' in g
          assert 'g3d_sleep = value >= 2 ? 1u : 0u;' in g
          assert 'g3d_idle_gate();' in gpu
          assert 'g3d_lab_gpu_safe' in gpu and 'g3d_lab_protection_ok' in gpu
          assert 'p6-churn:' in p and 'crash=unverified' in p
          for field in ('p6_usb_ticks','p6_usb_connected_ticks','p6_usb_overlap_ticks'):
              assert f'SYSCTL_QUAD(_kern_hakios, OID_AUTO, {field}' in usb
          for field in ('p6_touch_irqs','p6_touch_polls'):
              assert f'SYSCTL_QUAD(_kern_hakios, OID_AUTO, {field}' in touch
          assert '__atomic_fetch_add(&p6_usb_ticks' in usb and '__atomic_fetch_add(&p6_touch_irq_handlers' in touch
          assert '__atomic_fetch_add(&p6_touch_poll_checks' in touch
          assert 'p6_sample_driver_sources(p6_phase,uptime)' in p and 'p6-source:' in p
          assert 'p6_wifi_irq_handlers' in wifi and 'p6_wifi_irqs' in wifi
          assert '__atomic_fetch_add(&p6_wifi_irq_handlers' in wifi
          assert '"kern.hakios.p6_wifi_irqs"' in p
          assert 'DRIVER-SOURCE:' in report
          assert 'strncmp(name,"PridePoster",11)' in p
          assert 'CONFIRMED PridePoster SIGSEGV exits' in Path('tools/s9-p6-report.ps1').read_text()
          assert 'p6-ca-thread:' in p and 'sampled_libproc_no_stack' in p
          assert 'p6-ca-gl:' in e and 'EAGL_wall_time_no_CA_stack' in e
          assert 'GateGuard' in serial and 'EnableActualG3D' in serial
          assert "g3d_lab_reset=1" in serial and 'GATE' in serial
          assert 'rail_valid=1' in serial and 'rail_last_mv=950' in serial
          assert 'g3d_lab_rail_probe=1' in serial and 'g3d_lab_rail_probe=0' in serial
          assert 'p6_mode=0' in serial and 'p5_mode=0' in serial
          assert 'mali_dvs=1' not in serial and 'g3d_lab_mv=900' not in serial
          assert 'Get-P6DisplayEvidence' in serial and 'FRAME_PROXY' in serial
          assert 'if($Execute -and -not $script:OnEventProven)' in serial and 'ResumeCAOnly' in serial
          # P6.6--P6.9 are explicit read-only observers, defaults 0;
          # they never change the GPU gate or a GL drawing decision.
          keys=Path('drivers/input/hakios.exynos_keys.c').read_text()
          for f in ('p66_mode','p67_mode','p69_mode'):
              assert f'SYSCTL_UINT(_kern_hakios, OID_AUTO, {f}' in k
          for f in ('p69_key_polls','p69_key_power_down','p69_key_power_up','p69_key_held_polls'):
              assert f'SYSCTL_QUAD(_kern_hakios, OID_AUTO, {f}' in keys
          for f in ('p69_touch_pin_low','p69_touch_event_reads'):
              assert f'SYSCTL_QUAD(_kern_hakios, OID_AUTO, {f}' in touch
          for f in ('p69_usb_disconnected_ticks','p69_usb_link_stopped_ticks'):
              assert f'SYSCTL_QUAD(_kern_hakios, OID_AUTO, {f}' in usb
          assert 'p68_mode_sysctl' in g and 'p68-g3d:' in g
          assert 'p68_mode' in gpu and 'g3d_lab_monitor_start();' in g
          assert 'p66-ca:' in e and 'p66_frame_observe' in e
          assert 'p67-cost:' in e and 'p67-path:' in e
          assert 's9_p66_add(&e->p66,&ev)' in e and 'output_pixels=unverified skip_applied=0' in e
          assert 'p69-source:' in p and 'p69_sample_driver_sources' in p
          assert 'P6_MAX_IDENTITIES 8' in p and 'p6_pid_prev_n' in p
          assert 'budget_s' in p and '14400ull' in p
          assert 'ExtendedOnly' in serial and 'ExtendedScreenOff' in serial
          assert 'p6_phase=11' in serial and 'p6_phase=12' in serial
          assert 'p6_phase=13' in serial and 'p6_phase=15' in serial
          extbody=serial.split('function Run-ExtendedPhases {',1)[1].split('function Run-CAStage {',1)[0]
          assert 'g3d_lab_gate=2' not in extbody and 'g3d_lab_mv=' not in extbody
          for name in ('p66_mode','p67_mode','p68_mode','p69_mode'):
              assert f'{name}=0' in serial
          # P6.10--P6.12: all diagnostic only and all default OFF.
          for name in ('p610_mode','p611_mode','p612_mode'):
              assert f'SYSCTL_UINT(_kern_hakios, OID_AUTO, {name}' in k
              assert f'{name}=0' in serial
          assert 'power/exynos bsd/dev/hakios.p610_gov_diag.h' in m
          assert 's9_p610_add(&p610_stats,&ev)' in cpu
          assert 'p610-gov:' in cpu and 'p610-gap:' in cpu
          assert 'to = scion_state(' in cpu and 'dev_state = to;' in cpu
          assert 'p610_mode' in cpu and 'applied=0' in cpu
          assert 'p611-hash:' in e and 'p611-surface:' in e
          assert 's9_p611_skip' in e and 's9_p611_check' in e
          assert 'hash_sample || p611_sample' in e and 's9_gl_diag_sample16(&e->p611_hash_serial)' in e
          assert 'p612-eagl:' in e and 'p612_frame_observe' in e
          assert 's9_p612_add(&e->p612,&f)' in e
          assert 'presented += present_result;' in e
          assert 'DeepOnly' in serial
          assert all('p6_phase='+str(n) in serial for n in (20,21,22,23,24))
          deep=serial.split('function Run-DeepPhases {',1)[1].split('function Run-ExtendedPhases {',1)[0]
          assert 'g3d_lab_gate=2' not in deep and 'g3d_lab_gate=3' not in deep
          assert 'g3d_lab_mv=' not in deep and 'mali_gov_frame=' not in deep
          assert 'gov_policy=' not in deep and 'gov_frame_big=' not in deep
          # Parallel charger/governor/compositor evidence: no new power writes.
          charge=Path('drivers/power/max77705/hakios.max77705.c').read_text()
          assert 'max77705_diag_s' in charge and 'chg_diag_ticks' in charge
          assert 'if(chg_diag && diag_s>=30 && diag_s<=300 && diag_s%5==0)' in charge
          assert 'if (chg_diag_ticks && tick%chg_diag_ticks==0 && tick%60!=0)' in charge
          assert 'chg_diag_say("periodic")' in charge and 'up=%llus' in charge
          assert 'CHG_DIAG_FIRST  0xB2' in charge and 'CHG_DIAG_LAST   0xC5' in charge
          assert 'if (chg_wdt && tick % WDT_KICK_POLLS == 0)' in charge
          assert 'p610-trans:' in cpu and 'ev.transitioned && p610_stats.transitions<=4' in cpu
          assert 'frame_age_ms=' in cpu and 'quiet_ms=' in cpu and 'applied=0' in cpu
          assert 'ParallelOnly' in serial and 'BatteryStopC=46' in serial
          for n in (30,31,32,33,34,35):
              assert f'p6_phase={n}' in serial
          parallel=serial.split('function Run-ParallelPhases {',1)[1].split('function Run-DeepPhases {',1)[0]
          for forbidden in ('g3d_lab_gate=2','g3d_lab_gate=3','gov_policy=','max77705_wdt=1',
                            'g3d_lab_mv=','mali_gov_frame='):
              assert forbidden not in parallel, forbidden
          assert 'tools/s9-p6-parallel-report.ps1' in serial
          print('P6.1--P6.12 and parallel charger/governor/CA source/rollback guards PASS')
          PY
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 parsing and safe COM125 previews (no COM connection)
        shell: powershell
        run: |
          foreach($file in @('tools/s9-p6-serial-auto.ps1','tools/s9-p6-report.ps1','tools/s9-p6-extended-report.ps1','tools/s9-p6-deep-report.ps1','tools/s9-p6-parallel-report.ps1')){
            $t=$null;$e=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$t,[ref]$e)
            if($e.Count){throw "$file errors: $($e -join '; ')"}
          }
          $preview=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/s9-p6-serial-auto.ps1 -EnableActualG3D
          if($LASTEXITCODE -ne 0){throw 'P6 dry-run failed'}
          $text=$preview -join "`n"
          foreach($marker in @('PREVIEW SEND/VERIFY: sysctl kern.hakios.p6_phase=0',
            'p6_flags=1','p6_flags=3','p6_flags=5','p6_flags=9',
            'g3d_lab_gate=1','g3d_lab_rail_probe=1', 'PREVIEW REQUIRE:', 'g3d_lab_gate=2',
            'p6_flags=17','p6_phase=8','PREVIEW complete')){
              if(-not $text.Contains($marker)){throw "Missing phase/guard $marker"}
          }
          $evidence=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/s9-p6-serial-auto.ps1 -TestDisplayEvidence
          if($LASTEXITCODE -ne 0 -or ($evidence -join "`n") -notmatch '9 deterministic tests PASS'){
            throw 'P6 screen ON evidence regression failed'
          }
          $resume=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/s9-p6-serial-auto.ps1 -ResumeCAOnly
          if($LASTEXITCODE -ne 0){throw 'P6 CA-only preview failed'}
          $resumeText=$resume -join "`n"
          foreach($marker in @('RESUME P6.5 ONLY','p6_mode=2','p6_flags=17','p6_phase=7','p6_phase=8','PREVIEW complete')){
            if(-not $resumeText.Contains($marker)){throw "P6 CA resume missing $marker"}
          }
          if($resumeText.Contains('p6_phase=1') -or $resumeText.Contains('p6_phase=5') -or
             $resumeText.Contains('g3d_lab_gate=2')){
            throw 'P6 CA-only resume replayed unrelated diagnostic/power phases'
          }
      - name: P6.6--P6.9 complete inert COM serial previews and synthetic offline report
        shell: powershell
        run: |
          $hostScript='tools/s9-p6-serial-auto.ps1'
          $preview=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $hostScript -ExtendedOnly
          if($LASTEXITCODE -ne 0){throw 'P6 extended preview failed'}
          $out=$preview -join "`n"
          foreach($marker in @('p66_mode=1','p67_mode=1','p68_mode=1','p69_mode=1',
            'p6_phase=10','p6_phase=11','p6_phase=12','p6_phase=13','p6_phase=15','p6_phase=16',
            'g3d_lab_gate=1','PREVIEW complete')){
            if(-not $out.Contains($marker)){throw "Missing read-only extended phase: $marker"}
          }
          if($out.Contains('g3d_lab_gate=2') -or $out.Contains('g3d_lab_reset=1')){
            throw 'Extended phases attempted an actual power operation'
          }
          $offPreview=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $hostScript -ExtendedOnly -ExtendedScreenOff
          if($LASTEXITCODE -ne 0 -or ($offPreview -join "`n") -notmatch 'p6_phase=14'){
            throw 'Optional OFF/ON branch phase14 missing'
          }
          if(($offPreview -join "`n") -match 'g3d_lab_gate=2'){
            throw 'Optional OFF branch must not real-gate G3D'
          }
          $test='tools/tests/p6-extended-synthetic.log'
          $report=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/s9-p6-extended-report.ps1 -Log $test
          if($LASTEXITCODE -ne 0){throw 'P6 extended report failed'}
          $text=$report -join "`n"
          foreach($mark in @('skipped_interleaved=0','PHASE=11','P6.6 TARGETS: frames=120',
            'candidates=80','PHASE=12','P6.7 CPU-SLOTS: frames=60','P6.7 PATH:',
            'PHASE=13','P6.8 PMU: on=2/2 off=0/2','PHASE=14','quiet_but_powered=1',
            'PHASE=15','P6.9 SOURCE:','keyPolls=200/2@100Hz',
            'PHASE=16','not CPU WFI exits')){
            if(-not $text.Contains($mark)){throw "Extended report missing $mark"}
          }
      - name: P6.10--P6.12 deep read-only phase preview and mixed-source report
        shell: powershell
        run: |
          $script='tools/s9-p6-serial-auto.ps1'
          $preview=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -DeepOnly
          if($LASTEXITCODE -ne 0){throw 'Deep-only COM preview failed'}
          $output=$preview -join "`n"
          foreach($marker in @('p610_mode=1','p611_mode=1','p612_mode=1',
              'p610_mode=0','p611_mode=0','p612_mode=0',
              'p6_phase=20','p6_phase=21','p6_phase=22','p6_phase=23','p6_phase=24',
              'PREVIEW complete')){
              if(-not $output.Contains($marker)){throw "Deep-only phase missing $marker"}
          }
          if($output.Contains('g3d_lab_gate=2') -or $output.Contains('g3d_lab_reset=1') -or
             $output.Contains('gov_policy=') -or $output.Contains('mali_gov_frame=')){
              throw 'Read-only deep phases attempted behavioral/hardware changes'
          }
          $raw='tools/tests/p6-deep-synthetic.log'
          $report=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/s9-p6-deep-report.ps1 -Log $raw
          if($LASTEXITCODE -ne 0){throw 'Deep report synthetic fixture failed'}
          $t=$report -join "`n"
          foreach($marker in @('rejected_interleaved=0','PHASE=20','PHASE=21','PHASE=22',
             'PHASE=23','PHASE=24','P6.10 GOVERNOR: windows=50',
             'sticky_windows=45','51to150ms=20','P6.11 CHECKS: frames=60',
             'skip_seldom=720','P6.11 TOP-SURFACE: id=812',
             'P6.12 EAGL: frames=60','alternating=58',
             'positive=0 zero=60', 'EAGL_API_RETURN_NOT_PHYSICAL_PRESENT',
             'FB_presented=20','no_extra_hashes=1')){
             if(-not $t.Contains($marker)){throw "P6.10-12 offline report missing $marker"}
          }
          $old=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/s9-p6-deep-report.ps1 -Log tools/tests/p6-extended-synthetic.log
          if($LASTEXITCODE -ne 0 -or ($old -join "`n") -notmatch 'p610=0 p610gap=0 p611=0 p611surface=0 p612=0'){
              throw 'Deep reporter invented missing new phase data in old fixture'
          }
      - name: Parallel 30-35 COM safe dry-run, thermal guard and charger-state report
        shell: powershell
        run: |
          $script='tools/s9-p6-serial-auto.ps1'
          $therm=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -TestParallelThermal
          if($LASTEXITCODE -ne 0 -or ($therm -join "`n") -notmatch '4 deterministic tests PASS'){
             throw 'P6 parallel thermal parser regression failed'
          }
          $preview=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -ParallelOnly
          if($LASTEXITCODE -ne 0){throw 'Parallel-only COM dry-run failed'}
          $output=$preview -join "`n"
          foreach($marker in @('p610_mode=1','p611_mode=1','p612_mode=1',
             'p610_mode=0','p611_mode=0','p612_mode=0',
             'p6_phase=30','p6_phase=31','p6_phase=32','p6_phase=33',
             'p6_phase=34','p6_phase=35','Battery thermal guard 46 C',
             'PREVIEW complete')){
             if(-not $output.Contains($marker)){throw "Parallel phase not present $marker"}
          }
          if($output.Contains('g3d_lab_gate=2') -or $output.Contains('g3d_lab_reset=1') -or
             $output.Contains('gov_policy=') -or $output.Contains('max77705_wdt=1')){
             throw 'Parallel trial requests a write to GPU/governor/charger'
          }
          $invalidText='';$invalidExit=0
          try {
             $ErrorActionPreference='Continue'
             $invalid=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -ParallelOnly -EnableActualG3D 2>&1
             $invalidExit=$LASTEXITCODE
             $invalidText=$invalid -join "`n"
          }catch{
             $invalidExit=1
             $invalidText=$_.Exception.Message
          }finally{$ErrorActionPreference='Stop'}
          if($invalidExit -eq 0 -or $invalidText -notmatch 'ParallelOnly is read-only'){
             throw 'ParallelOnly must refuse actual GPU gating with explicit error'
          }
          $report=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/s9-p6-parallel-report.ps1 -Log tools/tests/p6-parallel-synthetic.log
          if($LASTEXITCODE -ne 0){throw 'Parallel synthetic report failed'}
          $text=$report -join "`n"
          foreach($marker in @('rejected=0','fg=6','charger=3',
             'phase=-1','WDTEN=1 CHGIN_DTLS=3 CHG_DTLS=1','up=30s',
             'NOT_CHARGING_STATE','phase=31','p610_transitions=1',
             'scion_transition up=105500ms','quiet=301ms',
             'checksum_samples=1','eagl_frames=60',
             'phase=35','QH_first_raw=43000')){
             if(-not $text.Contains($marker)){throw "Parallel report missing $marker"}
          }
          $older=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/s9-p6-parallel-report.ps1 -Log tools/tests/p6-deep-synthetic.log 3>&1
          if($LASTEXITCODE -ne 0 -or ($older -join "`n") -notmatch 'fg=0 battery=0 charger=0 gov_transition=0'){
             throw 'Old report must not invent fresh charger/transition evidence'
          }
      - name: P6 offline reporter handles mixed partial GPU serial noise
        shell: powershell
        run: |
          $file=Join-Path $env:TEMP 's9-p6-ci-test.log'
          @(
            'GenericARMPE: the display on (iOS power request before P6)',
            'p6: PHASE=2 up=100000ms flags=1',
            'p6-wake: up=105000ms phase=2 span_ms=5000 gov_loops=125 boost_requests=1 touches=1 presents=50 idle_lit=91 idle_big=95 missing=0',
            'p6-source: up=105s phase=2 usb_ticks=2500 usb_connected=2500 usb_overlap=0 touch_irq=0 touch_poll=1250 wifi_irq=14 present_mask=0x3f delta_valid=0x3f source=USB_thread_call_touch_GIC_handler_or_poll_not_all_CPU_wakeups',
            'p6: PHASE=3 up=110000ms flags=3',
            'p6-churn: up=115s phase=3 name=PridePosterExtension prev_pid=100 new_pid=101 changes=1 missing_samples=0 crash=unverified',
            'com.apple.xpc.launchd|2026-11-21 05:32:11.589808 (pid/137/com.apple.PridePoster.PridePosterExtension [101]) <Notice>: exited due to SIGSEGV | sent by exc handler[101]',
            'p6-proc: up=115s phase=3 name=PridePoster pid=101 cpu_pct=50.00 csw=120 faults=2 pageins=0 syscalls=200 valid_delta=1',
            'p6-proc: up=115s phase=3 name=CollectionsPoster pid=142 cpu_pct=0.00 csw=0 faults=0 pageins=0 syscalls=0 valid_delta=1',
            'p6-churn: up=115s phase=3 name=CollectionsPoster prev_pid=142 new_pid=154 changes=1 missing_samples=0 crash=unverified',
            'p6-proc: up=115s phase=3 name=CollectionsPoster pid=154 cpu_pct=0.00 csw=0 faults=0 pageins=0 syscalls=0 valid_delta=1',
            'p6: PHASE=4 up=120000ms flags=5',
            'p6-shadow: up=125000ms phase=4 big_mc=83000 gpu_mc=88000 m3_load=10 lit_load=11 mhz=455/962 frames=50 gap_ms=100 park_candidate=1 big_step=1 gpu_step=1 changed=1 writes=0',
            'p6: PHASE=7 up=130000ms flags=17',
            'p6-ca-gl: up=135.000s phase=7 n=60 avg_wall_us=200 draws=1200 target_draws=800 uploads=2 changed=0 unchecked=1 same=99 flush=60 finish=0',
            'p6: PHASE=5 up=140000ms flags=9',
            'exynos_keys: power down',
            'exynos_keys: power up',
            'GenericARMPE: the display off (iOS power request)',
            'exynos_keys: a minute: presses power 1, volume-up 0, volume-down 0, bixby 0',
            'p5-gl-burst: up=135.000s phase=7 max_draw=fps: 60 presented'
          ) | Set-Content -LiteralPath $file -Encoding ASCII
          $report=& powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/s9-p6-report.ps1 -Log $file
          if($LASTEXITCODE -ne 0){throw 'P6 report failed'}
          $text=$report -join "`n"
          foreach($marker in @('PHASE=2:', 'WAKE-PROXY:', 'DRIVER-SOURCE:', 'PID-CHURN',
            'PID-ALIAS CollectionsPoster', 'pidAliasSameSecond=1',
            'phase=5 display_off=1 display_on=0 power_down=1 power_up=1',
            'SHADOW:', 'CA GL:', 'CONFIRMED PridePoster SIGSEGV exits in launchd log=1',
            'skipped-interleaved=0', 'NOT MEASURED:')){
            if(-not $text.Contains($marker)){throw "P6 report missing $marker"}
          }
          if($text.Contains('PID-CHURN CANDIDATE CollectionsPoster')){
            throw 'The reporter falsely labels simultaneous same-name PIDs as process restarts'
          }
