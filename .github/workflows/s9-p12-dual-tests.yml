name: S9 P12 thermal efficiency and deep-idle observability
on:
  push:
    branches: [s9/p12-thermal-deep-idle, s9/p12-3-source-attribution, s9/p12-3-1-thermal-attribution, s9/p12-4-guarded-thermal]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute exact adaptive CPU guard helper
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 tools/tests/test_s9_p12_thermal_policy.c -o /tmp/s9-p12
          /tmp/s9-p12
          cc -std=c11 -Wall -Wextra -Werror -O2 tools/tests/test_s9_p122_rootcause.c -o /tmp/s9-p122
          /tmp/s9-p122
          cc -std=c11 -Wall -Wextra -Werror -O2 tools/tests/test_s9_p10_lock_policy.c -o /tmp/s9-p10
          /tmp/s9-p10
          cc -std=c11 -Wall -Wextra -Werror -O2 tools/tests/test_s9_p9_clock_policy.c -o /tmp/s9-p9
          /tmp/s9-p9
          python3 tools/tests/test_p124_gic_observer.py
          python3 tools/tests/test_p1241_timer_observer.py
          python3 tools/tests/test_p125_timer_observer.py
          node tools/tests/test-p125-symbol-map.js
          node tools/tests/test-p126-contract.js
          node tools/tests/test-p127-contract.js
          python3 tools/tests/test_p127_jiffies_header.py
      - name: Check source guards, preserving P9 panel and P7 CPU recovery safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=lambda p: Path(p).read_text()
          cpu=s('drivers/power/exynos/hakios.exynos_cpufreq.c')
          thermal=s('drivers/power/exynos/hakios.p12_thermal.h')
          mali=s('drivers/gpu/mali/hakios.mali.c')
          g3d=s('drivers/gpu/mali/hakios.mali_lab.h')
          xnu=s('xnu/files/cpu.c')
          bb=s('userland/src/inject.c')
          pe=s('xnu/files/GenericARMPE.cpp')
          host=s('tools/s9-p12-dual-serial.ps1')
          life=s('tools/s9-screen-lifecycle-serial.ps1')
          home=s('userland/src/s9_home_idle.inc')
          assert 's9_p12_cpu_eligible' in cpu and 'p12_cpu_mode_sysctl' in cpu
          assert 'p12_late_until' in cpu and 'p12_frame_streak' in cpu
          assert 'big_millidegrees < 83000' in thermal
          assert 'p12_gpu_boot_auto' in mali and 'p12_gpu_boot_enable()' in mali
          assert 'p122_diag_mode_sysctl' in mali and 'p122_gpu_stats_sysctl' in mali
          assert 'p122_job_latency' in mali and 'p122_gov_forced' in mali
          assert 'p122_job_q_hist' in mali and 'p122_job_e_hist' in mali
          assert 's9_p122_mode_valid' in s('drivers/gpu/mali/hakios.p122_diag.h')
          assert all(w in g3d for w in ('reached >= STEPS', 'g3d_lab_gpu_safe', 'g3d_lab_protection_ok', 'g3d_lab_idle_ms = 10000;', 'g3d_sleep = 1;', 'p9_auto_gpu = 1;', 'p12_gpu_boot_stats_sysctl'))
          assert 'hakios_display_requested_on() != 0' in mali
          assert 'g3d_lab_stats_sysctl' in g3d
          assert 'hakios_p12_wfi_entries' in xnu and 'hakios_p12_wfi_ticks' in xnu
          assert '__builtin_arm_wfi();' in xnu
          assert 'p12_wfi_probe_sysctl' in cpu and 'p12_wfi_stats_sysctl' in cpu
          assert 'p12_idle_diag_sysctl' in cpu
          eagl=s('userland/src/eagl.c')
          assert 'p122-gl: mode=%d ack=kernel_sysctl' in eagl
          assert 'p122-gl-window:' in eagl and 'p122_thread_cpu_us' in eagl
          assert 'p122_completed_window' in eagl
          assert xnu.count('(unsigned)cpu_data_ptr->cpu_number; /* cpu_id is an opaque PE object') == 2
          assert 's9_p1231_rates_valid' in mali and 'level572_ns=' in mali
          assert 'p1231_hash_mode_sysctl' in mali and 'p1231_hash4_sum' in eagl
          assert 'p1231_control_worker' in eagl and 'applied_unknown=1' in eagl
          assert 'p1231-clock-meta:' in s('userland/src/s9_hi_clock_resolve.inc')
          assert 'p1231-clock-view:' in s('userland/src/s9_hi_clock_resolve.inc')
          assert 'p1231_ufs_stats_sysctl' in s('drivers/storage/ufs/hakios.ufs.c')
          assert 'p124_cpu_mode_sysctl' in cpu and 's9_p124_temp_ok' in thermal
          assert 's9_p1241_temp_ok' in cpu and 's9_p1241_rise_ok' in cpu and 'guard_revision=2' in cpu
          assert 'p1241_timer_stats_sysctl' in cpu and 'hakios_p1241_timer_observe' in xnu
          assert 'p1241-timer-observer.py' in s('xnu/fork.sh')
          assert 'hakios_p124_loader_gone' in s('xnu/files/psci_smp.c')
          assert 'hakios_p124_ufs_safe' in s('drivers/storage/ufs/hakios.ufs.c')
          assert 'hakios_p124_irq_observe' in xnu and 'p124-gic-observer.py' in s('xnu/fork.sh')
          assert 'p124-clock: armed=1' in home and 'p124-hash:' in eagl and 'p124-texture:' in eagl
          assert 'hakios_p124_gpu_touch' in mali and '/redwood/bin/cpu_test 240 &' not in s('userland/rc.jobs')
          assert 'GpuLabOffCount' in life
          assert 'p123_floor_mode_sysctl' in mali and 'p123_floor_stats_sysctl' in mali
          assert 's9_p123_floor_eligible' in mali and '30ull*NSEC_PER_SEC' in mali
          assert 'hakios_p123_input_quiet' in cpu and 'p123_floor_until,0' in mali
          assert 'p123-clock-window:' in home and 'crossover_requires_explicit_252' in home
          assert 'hi_kind_checked' in s('userland/src/s9_hi_clock_resolve.inc')
          assert 'UIView_runtime_identity_or_ABI_conflict' in s('userland/src/s9_hi_clock_resolve.inc')
          assert 'p123-ca-window:' in bb and 'p123-gl-window:' in eagl
          assert 'g2_bind_on=0;' in eagl and 's9_p123_sample_frame' in eagl
          root=s('tools/s9-p122-rootcause-serial.ps1')
          assert all(word in root for word in ('P12-CoolStart 12','P12-QuiesceHI2',
            'P122-Profile 0', 'P122-Profile 1', 'P122-Profile 2',
            'ROOT_MIN_A', 'ROOT_MIN_B', 'P122-Snapshot', 'P122-Deltas',
            'p122-gl-window:', "P12-Query 'p122_diag_mode' '0' -Cleanup"))
          assert 'P122-Snapshot' in root and 'P122-Deltas' in root
          assert all(word in xnu for word in ('hakios_p12_idle_enter', 'hakios_p12_idle_denied',
            'hakios_p12_idle_timer', 'hakios_p12_idle_wfe', 'hakios_p12_idle_wfi_path',
            'hakios_p12_idle_exit_count', 'hakios_p12_idle_unmapped'))
          assert all(word in host for word in ('P12-CoolStart 12', 'P12-QuiesceHI2',
            'P12-EarlyThermalGuard', 'if($InteractiveAB)', 'P12-Observe \'PASSIVE_ON\'',
            'P12-Query \'hi_cmd\' \'201\'', 'P12HiGateStopSeen',
            'if(-not $Cleanup){Life-CheckSafety', '-LegacyFirmware', '-WakeCheck'))
          assert 'if(command==0 || command==201)' in home
          assert 'hi_auto_cancel("manual_usb_control",true)' in home
          assert 'S9 P12.1 NATURAL SCREEN LIFECYCLE' in life
          assert 'orig_render_update(server, update, flags)' in bb
          assert 'p12-ca: forwarded=' in bb and 'skipped=0 GL_present_unchanged=1' in bb
          assert 'p8-safety: BIG CPU_OFF REFUSED' in pe
          assert 'if(value==1)return EPERM;' in s('drivers/power/exynos/hakios.p7_cpu_lab.h')
          assert 'int hakios_p9_panel_auto_on(void) { return 0; }' in s('drivers/core/hakios.stubs.c')
          assert 'panel_sleep=1' not in s('tools/s9-p12-dual-serial.ps1')
          print('P12.2 live GLES mode ACK, Mali DVFS/queue/execute histogram, P12.1 thermal/CPU idle and P9/P7 interlocks PASS')
          PY
          git diff --check
  windows-host:
    runs-on: windows-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: P12 and P11/P10/P9/P8 host tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($test in @(
            'tools/tests/test-s9-p12-dual-serial.ps1',
            'tools/tests/test-s9-p122-rootcause-serial.ps1',
            'tools/tests/test-s9-p123-source-serial.ps1',
            'tools/tests/test-s9-p1231-thermal-serial.ps1',
            'tools/tests/test-s9-p124-thermal-serial.ps1',
            'tools/tests/test-s9-p1241-suite.ps1',
            'tools/tests/test-s9-p125-timer-serial.ps1',
            'tools/tests/test-s9-p126-driver-trials.ps1',
            'tools/tests/test-s9-p127-energy-trials.ps1',
            'tools/tests/test-s9-p127-serial-recovery.ps1',
            'tools/tests/test-s9-p11-lifecycle-serial.ps1',
            'tools/tests/test-s9-p10-lockscreen-source.ps1',
            'tools/tests/test-s9-p10-serial-harness.ps1',
            'tools/tests/test-s9-p9-power-fix.ps1',
            'tools/tests/test-s9-p8-unified.ps1')){
            $out=Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileName($test)+'.out')
            $err=Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileName($test)+'.err')
            $p=Start-Process -FilePath "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList @(
              '-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',$test) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
            $stdout=[IO.File]::ReadAllText($out)
            $stderr=[IO.File]::ReadAllText($err)
            Write-Output $stdout
            if($stderr){Write-Output $stderr}
            if($p.ExitCode -ne 0){throw "Regression failed $test exit=$($p.ExitCode)"}
          }
  ios-userland-syntax:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: iOS arm64 userland CA/render injection syntax
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -std=gnu11 -fblocks -Wno-deprecated-declarations \
            -fsyntax-only userland/src/inject.c
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -std=gnu11 -fblocks -Wno-deprecated-declarations \
            -fsyntax-only userland/src/inject_sb.c
          # eagl.c depends on the generated Mesa/EAGL slot table, built
          # by userland/build.sh in the paired installer. Do not falsely
          # report a standalone syntax pass with a missing/stub table.
          echo 'EAGL compile verification belongs to the paired SYSTEM build (generated eagl_gen.h).'
