name: S9 Home Idle one-boot A/B
on:
  push:
    branches: [s9/home-idle-oneboot-ab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-and-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: C11 and C++17 fail-open policy test (UBSan)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=undefined tools/tests/test_s9_home_idle_policy.c -o /tmp/s9_hi_c
          /tmp/s9_hi_c
          c++ -x c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=undefined tools/tests/test_s9_home_idle_policy.c -o /tmp/s9_hi_cpp
          /tmp/s9_hi_cpp
      - name: Autonomous cross-over C11 and C++17 fail-open tests (UBSan)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=undefined tools/tests/test_s9_hi_auto_policy.c -o /tmp/s9_auto_c
          /tmp/s9_auto_c
          c++ -x c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=undefined tools/tests/test_s9_hi_auto_policy.c -o /tmp/s9_auto_cpp
          /tmp/s9_auto_cpp
      - name: Boot-args catalog and integration guards
        run: |
          python3 tools/boot-args.py --check
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          sb=Path('userland/src/inject_sb.c').read_text()
          inc=Path('userland/src/s9_home_idle.inc').read_text()
          kernel=Path('drivers/gpu/mali/hakios.mali.c').read_text()
          doc=Path('docs/s9-home-idle-oneboot.md').read_text()
          assert '#include "s9_home_idle.inc"' in sb
          assert 'const char *hi_arg = strstr(arguments, "hi=1")' in sb
          assert "hi_arg[4] == '\\0'" in sb
          assert 'const char *hi_auto_arg = strstr(arguments, "hi=2")' in sb
          assert "hi_auto_arg[4] == '\\0'" in sb
          assert "hi_enabled = hi_auto_mode ||" in sb
          assert 'if (hi_enabled) hi_set_requested_fps' in sb
          assert 'hi_make_link(self, selector, target, action)' in sb
          assert 'hi_usb_command();' in inc
          assert 'SYSCTL_UINT(_kern_hakios, OID_AUTO, hi_cmd' in kernel
          assert 'hi_cmd, CTLFLAG_RW | CTLFLAG_LOCKED | CTLFLAG_ANYBODY | CTLFLAG_KERN' in kernel
          assert 'hi_group_clock(' in inc
          assert '(!hi_animations_absent && !clock_source)' in inc
          assert '#include "s9_hi_auto_policy.h"' in inc
          assert '#include "s9_home_idle_auto.inc"' in inc
          assert '#include "s9_home_idle_detail.inc"' in inc
          detail=Path('userland/src/s9_home_idle_detail.inc').read_text()
          auto=Path('userland/src/s9_home_idle_auto.inc').read_text()
          usb=Path('drivers/usb/hakios.dwc3.c').read_text()
          assert 'kernel_sysctlbyname(arg, NULL, NULL, &value, sizeof(value))' in usb
          assert 'hi: ctl_selftest read_rc=' in inc and 'hi: ctl=RECEIVED' in inc
          assert 'hi_auto_sample(now);' in inc and 'hi_auto_tick();' in inc
          for phase in ('HI_AUTO_BASELINE','HI_AUTO_CUT1','HI_AUTO_RECOVER1','HI_AUTO_CUT2','HI_AUTO_RECOVER2'):
              assert phase in Path('userland/src/s9_hi_auto_policy.h').read_text()
          for symptom in ('hi: ctx id=','hi: clock_view','intersects_window','hidden_ancestors','hi: anim layer='):
              assert symptom in detail
          assert 'hi_auto_candidate(' in auto and 'hi_auto_must_abort(' in auto
          assert 'hi_auto_cut_phase(' in auto and 'hi_auto_disable_gate();' in auto
          assert 'hi_auto_rearm(void)' in auto
          scene = Path('userland/src/s9_home_idle_scene.inc').read_text()
          assert 'posix_spawn(' in scene and 'prefs:root=General' in scene
          assert 'settings_confirmed=' in scene and 'com.apple.Preferences' in scene
          assert 'hi_cmd' in inc and 'hi: ping mode=' in inc
          assert 'hi_auto_rearm();return;' in inc
          assert 'hi_open_settings(false);return;' in inc
          assert 'hi_open_settings(true);return;' in inc
          assert 'if(command==250)' in inc and 'if(command==252)' in inc
          assert 'if(command==300)' in inc and 'if(command==301)' in inc
          assert 'SBSOpenSensitiveURLAndUnlock' in scene
          assert 'hi: settings_open request=1 route=%s' in scene
          assert 'hi_scene_snapshot();' in inc
          assert 'powershell -NoProfile -ExecutionPolicy Bypass' in Path('docs/s9-home-idle-serial-auto.md').read_text()
          runner = Path('tools/s9-home-idle-serial-auto.ps1').read_text()
          for hook in ('[IO.Ports.SerialPort]','hi: auto=REARM','hi: auto=FINISHED',
                       'swipe l 1 350 1000','hi: mark=secondary',
                       'settings_confirmed','No exact echo/ACK','Invoke-Report'):
              assert hook in runner, hook
          assert 'sysctl kern.hakios.hi_cmd=250' in runner
          assert 'sysctl kern.hakios.hi_cmd=252' in runner
          assert 'sysctl kern.hakios.hi_cmd=300' in runner
          assert 'sysctl kern.hakios.hi_cmd=301' in runner
          assert 'hi: settings_open request=1 route=helper' in runner
          assert 'SendKeys.SendWait' not in runner and 'SendKeys(' not in runner
          assert 'sysctl kern.hakios.mali_gov_frame=0' not in runner
          assert 'hi_auto_mode && __atomic_load_n(&hi_auto_clock_gate' in inc
          assert 'hi_group_clock(group)' in inc
          assert 'hi: auto=FINISHED' in auto
          bootline = next(x for x in Path('docs/s9-home-idle-deep-oneboot.md').read_text().splitlines() if x.startswith('hi=2 '))
          assert len(bootline.encode()) <= 200, len(bootline)
          assert 's9_hi_clock_source(' in Path('userland/src/s9_home_idle_policy.h').read_text()
          assert 's9_hi_skip(' in inc and 'S9_HI_GATE_US' in inc
          assert 'hi_event_hook_ok' in inc and 'hi_animations_absent' in inc
          assert 'wallpaper_home_showing()' in inc
          assert 'homeIdleTick:' in inc and 'objc_setAssociatedObject' in inc
          assert 'com.hakios.hi.stop' in inc
          assert 'mali_gov_frame=450' in doc and 'max77705_fg_s=10' in doc
          assert 'glFlush' not in inc and 'glFinish' not in inc
          print('hi: source+mailbox+guard+rollback layout verified')
          PY
  report-parser:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: One-boot phase grouping, GPU, fuel gauge and callback counters
        shell: pwsh
        run: |
          $lines = & ./tools/s9-home-idle-report.ps1 -Log tools/tests/s9-home-idle-fixture.log
          $body = $lines -join "`n"
          foreach ($value in @('2 serial windows','main      fps=10.00','secondary fps=0.00',
                              'SBAnimationDisplayLink.advance:','CA commits/s=10.0',
                              '1 confirmed PridePoster SIGSEGV')) {
            if (!$body.Contains($value)) { throw "Report fixture missing: $value" }
          }
          $runner = './tools/s9-home-idle-serial-auto.ps1'
          $preview = (& $runner 6>&1) -join "`n"
          if (!$preview.Contains('PREVIEW')) { throw "HI2 USB COM runner preview failed" }
          $replay = (& $runner -ReplayLog tools/tests/s9-home-idle-auto-fixture.log 6>&1) -join "`n"
          if (!$replay.Contains('REPLAY SELFTEST PASS')) { throw "HI2 serial state-machine replay failed" }
          # An interrupted or previously completed auto run must be reset
          # by REARM before a new five-stage series is considered complete.
          $partial = Join-Path $env:RUNNER_TEMP 'hi2-rearm.log'
          $previous = Get-Content tools/tests/s9-home-idle-auto-fixture.log
          @($previous[0..5], 'hi: auto=REARM up=400s from_usb=1 requires_clock_10hz=1 quiet_s=8', $previous) |
            ForEach-Object { $_ } | Set-Content -Path $partial
          $rearmed = (& ./tools/s9-home-idle-report.ps1 -Log $partial) -join "`n"
          foreach ($value in @('5 serial windows','5 autonomous phases','auto_finished=True')) {
            if (!$rearmed.Contains($value)) { throw "Rearm parsing mixed old and new phases: $value" }
          }
          $fallback = (& ./tools/s9-home-idle-report.ps1 -Log tools/tests/s9-home-idle-eperm-fixture.log) -join "`n"
          foreach ($value in @('WARNING: hi_cmd=EPERM','2 serial windows','SBHClockApplicationIconImageView._timerFired:')) {
            if (!$fallback.Contains($value)) { throw "EPERM fallback missing: $value" }
          }
          $auto = (& ./tools/s9-home-idle-report.ps1 -Log tools/tests/s9-home-idle-auto-fixture.log) -join "`n"
          foreach ($value in @('5 autonomous phases','auto_finished=True',
                              'auto-baseline','auto-cut1','auto-recover1',
                              'auto-cut2','auto-recover2','cut=92')) {
            if (!$auto.Contains($value)) { throw "Autonomous cross-over report missing: $value" }
          }
          Write-Host "S9 HomeIdle report parser OK (manual, EPERM, auto A/B/A/B)"
  springboard-syntax:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: iOS SDK C/blocks syntax for SpringBoard injection
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun clang -target arm64-apple-ios16.0 -isysroot "$SDK" -std=gnu11 -fblocks \
            -Wno-deprecated-declarations -Wno-unknown-pragmas -fsyntax-only userland/src/inject_sb.c
